<div class="tablewrap"><table><thead><tr><th>Visit #</th><th>Tracking code</th><th>Browser</th><th>Device</th><th>Date & time</th></tr></thead><tbody>{% for v in visits %}<tr><td>{{ v.id }}</td><td>{{ v.link_code }}</td><td>{{ v.browser }}</td><td>{{ v.device }}</td><td>{{ v.visited_at }}</td></tr>{% else %}<tr><td colspan="5" class="empty">No visits yet. Generate a link and open it to record a test visit.</td></tr>{% endfor %}</tbody></table></div>
