<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TraceLite{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('home') }}"><b>T</b> TraceLite</a>
<nav><a href="{{ url_for('home') }}">Link Generator</a><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('analytics') }}">Analytics</a><a href="{{ url_for('links') }}">My Links</a></nav></header>
<main class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>TraceLite · Basic analytics · No IP or location storage</footer>
<script src="{{ url_for('static',filename='js/app.js') }}"></script></body></html>
